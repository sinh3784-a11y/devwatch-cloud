services:
  postgres:
    image: postgres:17
    container_name: devwatch-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_DB}

    ports:
      - "127.0.0.1:${DATABASE_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devwatch_user -d devwatch_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: